        category:
          type: string
        queue:
          type: string
        requester:
          $ref: "#/components/schemas/Person"
        assignee:
          $ref: "#/components/schemas/Person"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuditEntry:
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
        actor:
          $ref: "#/components/schemas/Person"
        field:
          type: string
        before:
          type: object
        after:
          type: object
        created_at:
          type: string
          format: date-time
    TagView:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        count:
          type: integer
          format: int64
    CategoryView:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        default_queue_id:
          type: string
          format: uuid
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details. `type` is a stable slug under /problems/
        that clients can switch on.
      properties:
        type:
          type: string
          example: /problems/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: 2 fields failed validation
        instance:
          type: string
          example: /api/v1/tickets
        correlation_id:
          type: string
          example: 8b1f2c0e-4d3a-4f0e-9a6b-2c7d1e5f9a10
        errors:
          type: array
          description: Present on validation problems only
          items:
            type: object
            properties:
              field:
                type: string
                example: title
              message:
                type: string
                example: size must be between 5 and 120
      required:
      - correlation_id
      - status
      - title
      - type
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
