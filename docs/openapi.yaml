  /api/v1/tickets:
    get:
      tags:
      - Tickets
      summary: List and search tickets
      description: "Filters combine with AND; comma-separated values within one filter\
        \ are OR. assignee_id accepts \"me\", \"unassigned\" or a user id; tag is\
        \ one tag name; q searches title and description (ranked by relevance unless\
        \ sort is given). sort is field,direction (created_at, updated_at, priority,\
        \ status, key; asc or desc) and may repeat. size is capped at 100. Requesters\
        \ always see only their own tickets."
      operationId: list_1
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - NEW
            - OPEN
            - PENDING
            - RESOLVED
            - CLOSED
            - CANCELLED
      - name: priority
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - P1_CRITICAL
            - P2_HIGH
            - P3_MEDIUM
            - P4_LOW
      - name: queue_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: requester_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: assignee_id
        in: query
        required: false
        schema:
          type: string
      - name: tag
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 0
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
