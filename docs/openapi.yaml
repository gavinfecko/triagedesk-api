      - Reference data
      summary: "Ticket categories, each with the queue it routes to"
      operationId: categories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryView"
        "400":
          description: Validation failed or the request is malformed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: The caller's role does not allow this
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: The resource does not exist or is not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: A business rule refused the request (see the type slug)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Unexpected error; quote the correlation id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    CreateUserRequest:
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          minLength: 0
        display_name:
          type: string
          maxLength: 80
          minLength: 2
        role:
          type: string
          enum:
          - ADMIN
          - AGENT
          - REQUESTER
        temporary_password:
          type: string
          maxLength: 128
          minLength: 12
      required:
      - display_name
      - email
      - role
      - temporary_password
    UserView:
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - AGENT
          - REQUESTER
        active:
          type: boolean
        must_change_password:
          type: boolean
        created_at:
          type: string
          format: date-time
    CreateTicketRequest:
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 5
        description:
          type: string
          maxLength: 5000
          minLength: 0
        category_id:
          type: string
          format: uuid
        priority:
          type: string
          enum:
          - P1_CRITICAL
          - P2_HIGH
          - P3_MEDIUM
          - P4_LOW
        requester_id:
          type: string
          format: uuid
        queue_id:
          type: string
          format: uuid
      required:
      - category_id
      - description
      - priority
      - title
    Person:
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
    Ref:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    TicketView:
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - NEW
          - OPEN
          - PENDING
          - RESOLVED
          - CLOSED
          - CANCELLED
        priority:
          type: string
          enum:
          - P1_CRITICAL
          - P2_HIGH
          - P3_MEDIUM
          - P4_LOW
        category:
          $ref: "#/components/schemas/Ref"
        queue:
          $ref: "#/components/schemas/Ref"
        requester:
          $ref: "#/components/schemas/Person"
        assignee:
          $ref: "#/components/schemas/Person"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        first_responded_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
    TransitionRequest:
      properties:
        to:
          type: string
          enum:
          - NEW
          - OPEN
          - PENDING
          - RESOLVED
          - CLOSED
          - CANCELLED
        comment:
          type: string
          maxLength: 10000
          minLength: 0
      required:
      - to
    NewComment:
      properties:
        body:
          type: string
          maxLength: 10000
          minLength: 0
        visibility:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
      required:
      - body
      - visibility
    CommentView:
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/Person"
        visibility:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
        body:
          type: string
        created_at:
          type: string
          format: date-time
    RegisterRequest:
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          minLength: 0
        display_name:
          type: string
          maxLength: 80
          minLength: 2
        password:
          type: string
          maxLength: 128
          minLength: 12
      required:
      - display_name
      - email
      - password
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          minLength: 1
      required:
      - refresh_token
    TokenPair:
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int64
    LoginRequest:
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    UpdateUserRequest:
      properties:
        display_name:
          type: string
          maxLength: 80
          minLength: 2
        role:
          type: string
          enum:
          - ADMIN
          - AGENT
          - REQUESTER
    PageMeta:
      properties:
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total_elements:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int32
    PageResponseUserView:
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserView"
        page:
          $ref: "#/components/schemas/PageMeta"
    PageResponseTicketSummary:
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TicketSummary"
        page:
          $ref: "#/components/schemas/PageMeta"
    TicketSummary:
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
          - NEW
          - OPEN
          - PENDING
          - RESOLVED
          - CLOSED
          - CANCELLED
        priority:
          type: string
          enum:
          - P1_CRITICAL
          - P2_HIGH
          - P3_MEDIUM
          - P4_LOW
        category:
          type: string
        queue:
          type: string
        requester:
          $ref: "#/components/schemas/Person"
        assignee:
          $ref: "#/components/schemas/Person"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CategoryView:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        default_queue_id:
          type: string
          format: uuid
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details. `type` is a stable slug under /problems/
        that clients can switch on.
      properties:
        type:
          type: string
          example: /problems/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: 2 fields failed validation
        instance:
          type: string
          example: /api/v1/tickets
        correlation_id:
          type: string
          example: 8b1f2c0e-4d3a-4f0e-9a6b-2c7d1e5f9a10
        errors:
          type: array
          description: Present on validation problems only
          items:
            type: object
            properties:
              field:
                type: string
                example: title
              message:
                type: string
                example: size must be between 5 and 120
      required:
      - correlation_id
      - status
      - title
      - type
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
