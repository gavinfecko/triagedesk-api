openapi: 3.1.0
info:
  title: TriageDesk API
  description: "Help desk ticketing for a small IT team: tickets, queues, SLA timers\
    \ that count business hours, an audit trail and reporting. Errors are RFC 9457\
    \ Problem Details with a stable `type` per error and a `correlation_id` on every\
    \ response."
  license:
    name: MIT
    url: https://github.com/gavinfecko/triagedesk-api/blob/main/LICENSE
  version: 0.1.0-SNAPSHOT
externalDocs:
  description: "Architecture, process and backlog"
  url: https://github.com/gavinfecko/triagedesk-api/tree/main/docs
servers:
- url: /
  description: This deployment
security:
- bearerAuth: []
tags:
- name: Auth
  description: "Register, log in, refresh and log out"
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Create a requester account
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          description: Validation failed or the request is malformed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: The caller's role does not allow this
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: The resource does not exist or is not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: A business rule refused the request (see the type slug)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Unexpected error; quote the correlation id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: "Rotate a refresh token: returns a new pair and retires the old refresh\
        \ token"
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Validation failed or the request is malformed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: The caller's role does not allow this
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: The resource does not exist or is not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: A business rule refused the request (see the type slug)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Unexpected error; quote the correlation id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: "End the caller's session: its refresh tokens stop working"
      operationId: logout
      responses:
        "204":
          description: No Content
        "400":
          description: Validation failed or the request is malformed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: The caller's role does not allow this
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: The resource does not exist or is not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: A business rule refused the request (see the type slug)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Unexpected error; quote the correlation id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Exchange email and password for an access token (15 min) and a refresh
        token (7 days)
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Validation failed or the request is malformed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: The caller's role does not allow this
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: The resource does not exist or is not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: A business rule refused the request (see the type slug)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Unexpected error; quote the correlation id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security: []
  /api/v1/users/me:
    get:
      tags:
      - Users
      summary: The calling user
      operationId: me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          description: Validation failed or the request is malformed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: The caller's role does not allow this
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: The resource does not exist or is not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: A business rule refused the request (see the type slug)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Unexpected error; quote the correlation id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    RegisterRequest:
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          minLength: 0
        display_name:
          type: string
          maxLength: 80
          minLength: 2
        password:
          type: string
          maxLength: 128
          minLength: 12
      required:
      - display_name
      - email
      - password
    UserView:
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - AGENT
          - REQUESTER
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          minLength: 1
      required:
      - refresh_token
    TokenPair:
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int64
    LoginRequest:
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details. `type` is a stable slug under /problems/
        that clients can switch on.
      properties:
        type:
          type: string
          example: /problems/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: 2 fields failed validation
        instance:
          type: string
          example: /api/v1/tickets
        correlation_id:
          type: string
          example: 8b1f2c0e-4d3a-4f0e-9a6b-2c7d1e5f9a10
        errors:
          type: array
          description: Present on validation problems only
          items:
            type: object
            properties:
              field:
                type: string
                example: title
              message:
                type: string
                example: size must be between 5 and 120
      required:
      - correlation_id
      - status
      - title
      - type
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
