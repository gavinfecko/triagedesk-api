openapi: 3.1.0
info:
  title: TriageDesk API
  description: "Help desk ticketing for a small IT team: tickets, queues, SLA timers\
    \ that count business hours, an audit trail and reporting. Errors are RFC 9457\
    \ Problem Details with a stable `type` per error and a `correlation_id` on every\
    \ response."
  license:
    name: MIT
    url: https://github.com/gavinfecko/triagedesk-api/blob/main/LICENSE
  version: 0.1.0-SNAPSHOT
externalDocs:
  description: "Architecture, process and backlog"
  url: https://github.com/gavinfecko/triagedesk-api/tree/main/docs
servers:
- url: /
  description: This deployment
security:
- bearerAuth: []
tags:
- name: Users
  description: "The caller's own account, and user administration (admins)"
- name: SLA
  description: Policies and business-hours calendars (admin)
- name: Auth
  description: "Register, log in, refresh and log out"
paths:
  /api/v1/tickets/{key}/tags:
    put:
      tags:
      - Tickets
      summary: Replace a ticket's tags (staff)
      description: Names are lower-cased and trimmed; unknown tags are created. Send
        an empty list to clear.
      operationId: replaceTags
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketView"
        "400":
          description: Validation failed or the request is malformed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: The caller's role does not allow this
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: The resource does not exist or is not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: A business rule refused the request (see the type slug)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Unexpected error; quote the correlation id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
