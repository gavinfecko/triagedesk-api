      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    TicketView:
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - NEW
          - OPEN
          - PENDING
          - RESOLVED
          - CLOSED
          - CANCELLED
        priority:
          type: string
          enum:
          - P1_CRITICAL
          - P2_HIGH
          - P3_MEDIUM
          - P4_LOW
        category:
          $ref: "#/components/schemas/Ref"
        queue:
          $ref: "#/components/schemas/Ref"
        requester:
          $ref: "#/components/schemas/Person"
        assignee:
          $ref: "#/components/schemas/Person"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        first_responded_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        reopen_count:
          type: integer
          format: int32
        tags:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int64
        warnings:
          type: array
          items:
            type: string
    CalendarRequest:
      properties:
        name:
          type: string
          maxLength: 60
          minLength: 2
        zone:
          type: string
          minLength: 1
        hours:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        holidays:
          type: array
          items:
            $ref: "#/components/schemas/Holiday"
      required:
      - holidays
      - hours
      - name
      - zone
    Holiday:
      properties:
        date:
          type: string
          format: date
        name:
          type: string
