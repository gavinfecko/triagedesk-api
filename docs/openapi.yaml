        "500":
          description: Unexpected error; quote the correlation id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
      - Tickets
      summary: Open a ticket
      description: Agents and admins may set requester_id (a ticket phoned in) and
        queue_id. Requesters always open their own ticket in the category's queue;
        staff-only fields they send are ignored and listed in warnings.
      operationId: create_1
      requestBody:
