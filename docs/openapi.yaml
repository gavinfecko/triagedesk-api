  /api/v1/tickets/{key}/transitions:
    post:
      tags:
      - Tickets
      summary: Move a ticket to another status
      description: "NEW→OPEN (staff), OPEN→PENDING (staff, comment required), PENDING→\
        OPEN (anyone), OPEN|PENDING→RESOLVED (staff, comment required), RESOLVED→\
        CLOSED (requester or admin), RESOLVED→OPEN (anyone), NEW→CANCELLED (requester\
        \ or admin), OPEN|PENDING→CANCELLED (admin). Anything else is 409 ticket-state-conflict.\
        \ A comment is stored as a public reply."
      operationId: transition
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
