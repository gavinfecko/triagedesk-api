# Local development: PostgreSQL and Mailpit from compose.yaml. Nothing here is a secret.
spring:
  config:
    import: optional:file:.env[.properties]   # JWT_SECRET and friends; `make up` creates .env from .env.example
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/triagedesk}
    username: ${DB_USER:triagedesk}
    password: ${DB_PASSWORD:triagedesk}
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
  mail:
    host: localhost
    port: 1025
management:
  endpoint:
    health:
      show-details: always
triagedesk:
  seed:
    enabled: true   # idempotent demo clinic: 9 users, 60 tickets (TD-15)
  docs:
    public: true
  jwt:
    secret: ${JWT_SECRET}   # HS256 in dev; prod uses RS256 (application-prod.yml)
