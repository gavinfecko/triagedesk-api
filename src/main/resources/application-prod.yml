# Production: every secret comes from the environment, and a missing one stops startup.
triagedesk:
  jwt:
    private-key: ${JWT_PRIVATE_KEY}   # PKCS#8 PEM, RS256
spring:
  mail:   # SMTP from the environment (TD-50); without SMTP_HOST startup fails, like a missing key
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: true
