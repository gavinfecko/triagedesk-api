spring:
  application:
    name: triagedesk-api
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'   # the JDBC driver would otherwise send the JVM's zone
      initialization-fail-timeout: 10000         # tolerate a database that is a few seconds behind us
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # only health is public (SecurityConfig)
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    git:
      mode: full
    java:
      enabled: true
    os:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json

triagedesk:
  version: "@project.version@"
  docs:
    public: false   # dev turns this on; in prod the docs are for admins

---
# dev and prod log one JSON object per line (Spring Boot structured logging, Logstash layout,
# MDC keys correlation_id / user_id included); the default and test profiles keep plain text.
spring:
  config:
    activate:
      on-profile: dev | prod
logging:
  structured:
    format:
      console: logstash
