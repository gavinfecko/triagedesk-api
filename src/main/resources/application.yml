spring:
  application:
    name: triagedesk-api
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'   # the JDBC driver would otherwise send the JVM's zone
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    git:
      mode: simple
