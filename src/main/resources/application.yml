spring:
  application:
    name: triagedesk-api
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'   # the JDBC driver would otherwise send the JVM's zone
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    git:
      mode: simple

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json

triagedesk:
  version: "@project.version@"
  docs:
    public: false   # dev turns this on; in prod the docs are for admins
