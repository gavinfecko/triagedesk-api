version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: ["type:task", "area:platform"]
    groups:
      spring: { patterns: ["org.springframework*"] }
      test: { patterns: ["org.junit*", "org.assertj*", "org.mockito*", "org.testcontainers*", "net.jqwik*", "com.tngtech.archunit*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: ["type:task", "area:platform"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: ["type:task", "area:platform"]
    ignore:
      # ADR-0002 pins Java 21 LTS; a JDK major upgrade is its own story with an ADR update.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
