name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -ntp

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21", cache: maven }
      # Spotless and ArchUnit arrive with TD-8; until then this validates the POM and resolves plugins.
      - run: ./mvnw $MAVEN_ARGS validate

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Unit, slice and integration tests (Testcontainers PostgreSQL)
        run: ./mvnw $MAVEN_ARGS verify
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          check_name: test results
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Secret scan (full history)
        run: >
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:latest
          git /repo --no-banner --redact --exit-code 1
      - name: Vulnerability scan (dependencies and config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  openapi-diff:
    name: openapi-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Regenerate docs/openapi.yaml from the code
        run: ./mvnw $MAVEN_ARGS test -Dtest=OpenApiSpecTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: The committed spec must match the code
        run: |
          if ! git diff --exit-code -- docs/openapi.yaml; then
            echo "::error file=docs/openapi.yaml::out of date. Run 'make docs' and commit the result."
            exit 1
          fi
      - name: No breaking changes against main (unless labelled breaking-change)
        if: github.event_name == 'pull_request'
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        run: |
          if ! git show origin/main:docs/openapi.yaml > /tmp/base.yaml 2>/dev/null; then
            echo "no spec on main yet, nothing to compare"; exit 0
          fi
          docker run --rm -v /tmp/base.yaml:/base.yaml:ro -v "$PWD/docs/openapi.yaml:/head.yaml:ro" \
            openapitools/openapi-diff:latest /base.yaml /head.yaml --fail-on-incompatible --markdown /dev/stdout

  docker:
    name: docker
    needs: [lint, build-test, security, openapi-diff]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The demo smoke test runs against the image before anything is pushed: a release tag never publishes an
      # image whose demo path is broken (TD-114).
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: triagedesk-api:smoke
          cache-from: type=gha
      - name: Demo smoke test
        run: scripts/demo-smoke.sh --compose
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
